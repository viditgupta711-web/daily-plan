<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#006644" />
  <title>Master Daily Plan</title>
  <!-- PWA: installable, offline Android/iOS app -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="My Plan" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: { DEFAULT: '#006644', dark: '#004d33', light: '#e6f2ee', mid: '#00875a' }
          },
          fontFamily: { sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    html, body { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior-y: contain; }
    .tabular { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .task-card { transition: opacity .25s ease, transform .25s ease, background-color .2s ease; }
    .checkbox-tick { transition: all .18s ease; }
    .modal-backdrop { backdrop-filter: blur(2px); }
    input[type=time]::-webkit-calendar-picker-indicator { filter: invert(28%) sepia(86%) saturate(1352%) hue-rotate(135deg) brightness(94%) contrast(101%); }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .no-sb::-webkit-scrollbar { display: none; }
    summary::-webkit-details-marker { display: none; }
    summary { list-style: none; }
    details[open] .chev { transform: rotate(180deg); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen antialiased">

  <!-- ===================== HEADER ===================== -->
  <header class="sticky top-0 z-30 bg-forest text-white shadow-lg" style="padding-top: env(safe-area-inset-top);">
    <div class="max-w-md mx-auto px-5 pt-4 pb-4">
      <div class="flex items-start justify-between">
        <div>
          <p id="dateLabel" class="text-forest-light/80 text-xs font-medium tracking-wide uppercase">—</p>
          <h1 id="clock" class="tabular text-5xl font-bold leading-none mt-1">--:--:--</h1>
        </div>
        <div class="shrink-0 flex flex-col items-end gap-2">
          <button id="editToggle"
            class="flex items-center gap-1.5 bg-white/15 active:bg-white/30 text-white text-sm font-semibold px-3 py-2 rounded-full transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
              <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
            </svg>
            <span id="editToggleLabel">Edit</span>
          </button>
          <button id="weatherPill" title="Tap to refresh weather"
            class="flex items-center gap-2 bg-white/15 active:bg-white/30 rounded-full pl-2.5 pr-3 py-1.5 transition">
            <span id="wIcon" class="text-xl leading-none">⏳</span>
            <span class="text-right leading-none">
              <span id="wTemp" class="tabular text-base font-bold text-white block leading-none">--°</span>
              <span id="wMeta" class="text-[10px] text-forest-light/90 block leading-none mt-1 whitespace-nowrap">Locating…</span>
            </span>
          </button>
        </div>
      </div>

      <!-- Summary (list views only) -->
      <div id="summaryBlock">
        <div class="mt-4 flex items-center gap-3">
          <div class="bg-white/15 rounded-xl px-3 py-2 text-center min-w-[78px]">
            <p id="remainingCount" class="tabular text-2xl font-bold leading-none">0</p>
            <p class="text-[10px] text-forest-light/90 uppercase tracking-wide mt-0.5">Remaining</p>
          </div>
          <div class="flex-1 bg-white/15 rounded-xl px-3 py-2 min-w-0">
            <p class="text-[10px] text-forest-light/90 uppercase tracking-wide">Next Up</p>
            <p id="nextTask" class="text-sm font-semibold leading-tight truncate mt-0.5">—</p>
          </div>
        </div>
        <div class="mt-3 h-1.5 bg-white/20 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-white rounded-full transition-all duration-500" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Day tabs (Plan only) -->
    <div id="dayTabs" class="max-w-md mx-auto px-3 pb-3">
      <div class="grid grid-cols-3 gap-1 bg-white/10 rounded-xl p-1">
        <button data-tab="weekday"  class="tab-btn rounded-lg py-2 text-sm font-semibold transition">Weekdays</button>
        <button data-tab="wednesday" class="tab-btn rounded-lg py-2 text-sm font-semibold transition">Wednesday</button>
        <button data-tab="weekend"  class="tab-btn rounded-lg py-2 text-sm font-semibold transition">Weekend</button>
      </div>
      <div id="weekendToggle" class="hidden mt-2 grid grid-cols-2 gap-1 bg-white/10 rounded-xl p-1">
        <button data-day="saturday" class="day-btn rounded-lg py-1.5 text-xs font-semibold transition">Saturday</button>
        <button data-day="sunday"   class="day-btn rounded-lg py-1.5 text-xs font-semibold transition">Sunday</button>
      </div>
    </div>
  </header>

  <!-- ===================== MAIN ===================== -->
  <main class="max-w-md mx-auto px-4 pt-4 pb-28">

    <!-- LIST VIEW (Plan + Hair) -->
    <section id="view-list">
      <div class="flex items-center justify-between mb-3 px-1">
        <p id="listTitle" class="text-xs font-bold uppercase tracking-wider text-gray-400">Schedule</p>
        <button id="resetBtn" class="flex items-center gap-1 text-xs font-semibold text-forest active:text-forest-dark">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
          </svg>
          <span id="resetLabel">Reset Day</span>
        </button>
      </div>
      <p id="hairNote" class="hidden text-xs text-gray-400 leading-snug mb-3 px-1 bg-gray-100 rounded-lg p-2.5">✎ Hair care isn’t in the source plan — these are editable starters. Tap <b>Edit</b> to tailor to your routine.</p>
      <div id="taskList" class="space-y-2.5"></div>
      <button id="addBtn"
        class="hidden mt-4 w-full border-2 border-dashed border-forest/40 text-forest font-semibold py-3.5 rounded-2xl active:bg-forest-light transition flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
        </svg>
        <span id="addBtnLabel">Add Task</span>
      </button>
      <p id="emptyState" class="hidden text-center text-gray-400 text-sm py-16">No items yet. Tap “Add” to begin.</p>
    </section>

    <!-- CUSTOM VIEWS -->
    <section id="view-food" class="hidden"></section>
    <section id="view-skin" class="hidden"></section>
    <section id="view-gym" class="hidden"></section>
    <section id="view-monthly" class="hidden"></section>
    <section id="view-dates" class="hidden"></section>
    <section id="view-goals" class="hidden"></section>
  </main>

  <!-- ===================== BOTTOM NAV ===================== -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-gray-200" style="padding-bottom: env(safe-area-inset-bottom);">
    <div class="max-w-md mx-auto flex overflow-x-auto no-sb scroll-smooth">
      <button data-view="plan"    class="nav-btn"><span class="text-xl leading-none">🗓️</span><span class="text-[10px] font-semibold">Plan</span></button>
      <button data-view="gym"     class="nav-btn"><span class="text-xl leading-none">🏋️</span><span class="text-[10px] font-semibold">Gym</span></button>
      <button data-view="todo"    class="nav-btn"><span class="text-xl leading-none">📝</span><span class="text-[10px] font-semibold">To-Do</span></button>
      <button data-view="goals"   class="nav-btn"><span class="text-xl leading-none">🎯</span><span class="text-[10px] font-semibold">Goals</span></button>
      <button data-view="dates"   class="nav-btn"><span class="text-xl leading-none">📅</span><span class="text-[10px] font-semibold">Dates</span></button>
      <button data-view="monthly" class="nav-btn"><span class="text-xl leading-none">📊</span><span class="text-[10px] font-semibold">Track</span></button>
      <button data-view="food"    class="nav-btn"><span class="text-xl leading-none">🍴</span><span class="text-[10px] font-semibold">Food</span></button>
      <button data-view="skin"    class="nav-btn"><span class="text-xl leading-none">✨</span><span class="text-[10px] font-semibold">Skin</span></button>
      <button data-view="hair"    class="nav-btn"><span class="text-xl leading-none">💆</span><span class="text-[10px] font-semibold">Hair</span></button>
    </div>
  </nav>

  <!-- ===================== EDIT MODAL ===================== -->
  <div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop bg-black/40 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl" style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));">
      <div class="flex items-center justify-between mb-4">
        <h2 id="modalTitle" class="text-lg font-bold text-gray-800">Edit Task</h2>
        <button id="modalClose" class="text-gray-400 active:text-gray-600 p-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>
      <div class="space-y-4">
        <div id="fTimeRow">
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Time <span class="text-gray-300 normal-case">(optional)</span></label>
          <input id="fTime" type="time"
            class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-base text-gray-800 focus:border-forest focus:ring-2 focus:ring-forest/20 outline-none" />
        </div>
        <div id="fDateRow" class="hidden">
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Date</label>
          <input id="fDate" type="date"
            class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-base text-gray-800 focus:border-forest focus:ring-2 focus:ring-forest/20 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Name</label>
          <input id="fLabel" type="text" placeholder="e.g. Meditation (20 min)"
            class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-base text-gray-800 focus:border-forest focus:ring-2 focus:ring-forest/20 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Notes</label>
          <textarea id="fNotes" rows="2" placeholder="Optional details…"
            class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-base text-gray-800 focus:border-forest focus:ring-2 focus:ring-forest/20 outline-none resize-none"></textarea>
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button id="modalDelete" class="hidden flex-1 bg-red-50 text-red-600 font-semibold py-3.5 rounded-xl active:bg-red-100 transition">Delete</button>
        <button id="modalSave" class="flex-[2] bg-forest text-white font-semibold py-3.5 rounded-xl active:bg-forest-dark transition shadow-md shadow-forest/30">Save</button>
      </div>
    </div>
  </div>

  <!-- ===================== TOAST ===================== -->
  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-[60] bg-gray-900 text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-xl"></div>

      for (const k in DEFAULTS) if (!Array.isArray(store[k])) store[k] = def[k]; // add new keys (e.g. hair)

  function to12h(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);

    return `${h % 12 === 0 ? 12 : h % 12}:${pad(m)} ${ap}`;
  }

    let all; try { all = JSON.parse(localStorage.getItem(HABITS_KEY) || '{}'); } catch (e) { all = {}; }

  /* ============================================================
     DATES (scheduler) & GOALS  — separate persistent stores
     ============================================================ */
  const EVENTS_KEY = 'habitTracker.events';
  const GOALS_KEY  = 'habitTracker.goals';
  const dateNAhead   = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return dstr(d); };
  const endOfMonthStr = () => { const d = new Date(); return dstr(new Date(d.getFullYear(), d.getMonth()+1, 0)); };

  function loadEvents() {

      { id: uid(), date: dateNAhead(3),  title: 'Submit 3 job applications', note: 'CV + tailored cover letter' },
      { id: uid(), date: dateNAhead(10), title: 'Coursera module deadline',  note: 'Data Analysis' },

    ];

  }
  function saveEvents() { localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); }

  function loadGoals() {
    try { const r = localStorage.getItem(GOALS_KEY); if (r) { goals = JSON.parse(r); ['week','month','year'].forEach(p => { if (!Array.isArray(goals[p])) goals[p] = []; }); return; } } catch (e) {}
    const g = (text) => ({ id: uid(), text, note:'', done:false });
    goals = {
      week:  [g('Apply to 10 roles'), g('Hit 4 gym sessions'), g('Finish 1 Coursera module')],
      month: [g('Complete APM section 2'), g('Reach 80 job applications'), g('Lose 1 kg')],
      year:  [g('Land a Product Manager role'), g('Finish APM certification'), g('Hold a 5-day training week')]
    };
    saveGoals();
  }
  function saveGoals() { localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); }

  /* date maths */
  function startOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d; }
  function endOfPeriod(p) {
    const d = new Date(); d.setHours(23,59,59,999);
    if (p === 'week') { const dow = (d.getDay()+6) % 7; d.setDate(d.getDate() + (6 - dow)); }
    else if (p === 'month') { d.setMonth(d.getMonth()+1, 0); }
    else { d.setMonth(11, 31); }
    return d;
  }
  function dayDiff(ds) { return Math.round((new Date(ds + 'T00:00') - startOfToday()) / 86400000); }
  function countdown(ds) {
    const n = dayDiff(ds);
    if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
    if (n > 1) { if (n < 7) return 'in ' + n + ' days'; if (n < 14) return 'in 1 week'; if (n < 31) return 'in ' + Math.round(n/7) + ' weeks'; if (n < 60) return 'in 1 month'; return 'in ' + Math.round(n/30) + ' months'; }
    const m = -n; if (m < 7) return m + ' days ago'; if (m < 31) return Math.round(m/7) + ' weeks ago'; return Math.round(m/30) + ' months ago';
  }
  const periodToggle = (which, cur) => {
    const fn = which === 'dates' ? 'setDatesPeriod' : 'setGoalsPeriod';
    return '<div class="flex gap-1 bg-gray-100 rounded-xl p-1 mb-1">' +
      [['week','Week'],['month','Month'],['year','Year']].map(([k,l]) =>
        `<button onclick="${fn}('${k}')" class="flex-1 rounded-lg py-2 text-sm font-semibold transition ${k===cur ? 'bg-forest text-white shadow' : 'text-gray-500 active:bg-gray-200'}">${l}</button>`
      ).join('') + '</div>';
  };
  const addBtnHtml = (label, onclick) =>
    `<button onclick="${onclick}" class="mt-3 w-full border-2 border-dashed border-forest/40 text-forest font-semibold py-3.5 rounded-2xl active:bg-forest-light transition flex items-center justify-center gap-2"><svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>${esc(label)}</button>`;

  function setDatesPeriod(p) { datesPeriod = p; renderDates(); }
  function setGoalsPeriod(p) { goalsPeriod = p; renderGoals(); }

  function eventCard(e) {
    const n = dayDiff(e.date), isToday = n === 0, over = n < 0;
    const chip = over ? 'bg-red-50 text-red-600' : isToday ? 'bg-forest text-white' : 'bg-forest-light text-forest';
    const d = new Date(e.date + 'T00:00');
    return `<div onclick="openEventModal('${e.id}')" class="bg-white rounded-2xl shadow-sm border ${isToday ? 'border-forest' : 'border-gray-100'} px-4 py-3 mb-2.5 flex items-center gap-3 cursor-pointer active:bg-gray-50">
      <div class="shrink-0 w-12 text-center">
        <p class="text-[10px] font-bold uppercase text-gray-400 leading-none">${d.toLocaleDateString(undefined,{month:'short'})}</p>
        <p class="tabular text-xl font-bold text-gray-800 leading-tight">${d.getDate()}</p>
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-[15px] text-gray-800 leading-snug">${esc(e.title)}</p>
        ${e.note ? `<p class="text-xs text-gray-400 leading-snug mt-0.5">${esc(e.note)}</p>` : ''}
      </div>
      <span class="shrink-0 text-[10px] font-bold px-2 py-1 rounded-full ${chip}">${countdown(e.date)}</span>
    </div>`;
  }

  function renderDates() {
    let h = periodToggle('dates', datesPeriod);
    const start = startOfToday(), end = endOfPeriod(datesPeriod);
    const sorted  = [...events].sort((a,b) => a.date.localeCompare(b.date));
    const overdue = sorted.filter(e => dayDiff(e.date) < 0);
    const within  = sorted.filter(e => { const t = new Date(e.date + 'T00:00'); return t >= start && t <= end; });

    if (overdue.length) {
      h += secTitle('⚠ Overdue');
      h += overdue.map(eventCard).join('');
    }
    h += secTitle({ week:'This Week', month:'This Month', year:'This Year' }[datesPeriod]);
    h += within.length ? within.map(eventCard).join('')
       : `<p class="text-center text-gray-400 text-sm py-10">No events ${{week:'this week',month:'this month',year:'this year'}[datesPeriod]}. Tap “Add Event”.</p>`;
    h += addBtnHtml('Add Event', 'openEventModal(null)');
    $('#view-dates').innerHTML = h;
  }

  function toggleGoal(id) {
    const it = goals[goalsPeriod].find(x => x.id === id);
    if (it) { it.done = !it.done; saveGoals(); renderGoals(); }
  }
  function renderGoals() {
    let h = periodToggle('goals', goalsPeriod);
    const list = goals[goalsPeriod] || [];
    const done = list.filter(x => x.done).length;
    const pct = list.length ? Math.round(done / list.length * 100) : 0;
    const label = { week:'This Week', month:'This Month', year:'This Year' }[goalsPeriod];
    h += `<div class="flex items-center justify-between mt-4 mb-2 px-1"><p class="text-xs font-bold uppercase tracking-wider text-gray-400">${label} · ${done}/${list.length}</p></div>`;
    h += `<div class="h-1.5 bg-gray-200 rounded-full overflow-hidden mb-3"><div class="h-full bg-forest rounded-full transition-all duration-500" style="width:${pct}%"></div></div>`;
    if (!list.length) {
      h += '<p class="text-center text-gray-400 text-sm py-10">No goals yet. Tap “Add Goal”.</p>';
    } else {
      [...list].sort((a,b) => (a.done?1:0) - (b.done?1:0)).forEach(go => {
        h += `<div class="bg-white rounded-2xl shadow-sm border border-gray-100 px-3.5 py-3 mb-2.5 flex items-center gap-3 ${go.done ? 'opacity-55' : ''}">
          <button onclick="toggleGoal('${go.id}')" class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center border-2 ${go.done ? 'bg-forest border-forest' : 'border-gray-300'}">
            ${go.done ? '<svg class="w-4 h-4 text-white" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>' : ''}
          </button>
          <div class="flex-1 min-w-0" onclick="openGoalModal('${go.id}')">
            <p class="text-[15px] font-semibold leading-snug ${go.done ? 'line-through text-gray-400' : 'text-gray-800'}">${esc(go.text)}</p>
            ${go.note ? `<p class="text-xs text-gray-400 leading-snug mt-0.5 ${go.done ? 'line-through' : ''}">${esc(go.note)}</p>` : ''}
          </div>
          <svg onclick="openGoalModal('${go.id}')" class="shrink-0 w-5 h-5 text-gray-300" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
        </div>`;
      });
    }
    h += addBtnHtml('Add Goal', 'openGoalModal(null)');
    $('#view-goals').innerHTML = h;
  }

  /* ---- Modal field visibility ---- */
  function showModalFields(kind) {
    $('#fTimeRow').classList.toggle('hidden', kind !== 'task');
    $('#fDateRow').classList.toggle('hidden', kind !== 'event');
  }
  function openEventModal(id) {
    modalKind = 'event'; editingId = id;
    $('#modalTitle').textContent = (id ? 'Edit ' : 'Add ') + 'Event';
    $('#modalDelete').classList.toggle('hidden', !id);
    showModalFields('event');
    if (id) { const e = events.find(x => x.id === id); $('#fDate').value = e.date; $('#fLabel').value = e.title; $('#fNotes').value = e.note || ''; }
    else    { $('#fDate').value = todayStr(); $('#fLabel').value = ''; $('#fNotes').value = ''; }
    $('#modal').classList.remove('hidden'); setTimeout(() => $('#fLabel').focus(), 50);
  }
  function openGoalModal(id) {
    modalKind = 'goal'; editingId = id;
    $('#modalTitle').textContent = (id ? 'Edit ' : 'Add ') + 'Goal';
    $('#modalDelete').classList.toggle('hidden', !id);
    showModalFields('goal');
    if (id) { const it = goals[goalsPeriod].find(x => x.id === id); $('#fLabel').value = it.text; $('#fNotes').value = it.note || ''; }
    else    { $('#fLabel').value = ''; $('#fNotes').value = ''; }
    $('#modal').classList.remove('hidden'); setTimeout(() => $('#fLabel').focus(), 50);
  }

  /* ---- Modal (CRUD for list views) ---- */
  function openModal(id) {
    modalKind = 'task'; showModalFields('task');
    editingId = id;
    const isEdit = !!id;
    $('#modalTitle').textContent = (isEdit ? 'Edit ' : 'Add ') + (view === 'hair' ? 'Item' : 'Task');
    $('#modalDelete').classList.toggle('hidden', !isEdit);
    if (isEdit) {
      const t = currentList().find(x => x.id === id);
      $('#fTime').value = t.time || ''; $('#fLabel').value = t.label; $('#fNotes').value = (t.notes && t.notes !== '—') ? t.notes : '';
    } else {
      $('#fTime').value = view === 'plan' ? nowHM() : ''; $('#fLabel').value = ''; $('#fNotes').value = '';
    }
    $('#modal').classList.remove('hidden');
    setTimeout(() => $('#fLabel').focus(), 50);
  }
  function closeModal() { $('#modal').classList.add('hidden'); editingId = null; }
  function saveModal() {
    const label = $('#fLabel').value.trim();
    if (!label) { toast('Please enter a name'); return; }
    const notes = $('#fNotes').value.trim();

    if (modalKind === 'event') {
      const date = $('#fDate').value || todayStr();
      if (editingId) Object.assign(events.find(x => x.id === editingId), { date, title: label, note: notes });
      else events.push({ id: uid(), date, title: label, note: notes });
      saveEvents(); renderDates(); closeModal(); toast(editingId ? 'Saved' : 'Event added'); return;
    }
    if (modalKind === 'goal') {
      const arr = goals[goalsPeriod];
      if (editingId) Object.assign(arr.find(x => x.id === editingId), { text: label, note: notes });
      else arr.push({ id: uid(), text: label, note: notes, done: false });
      saveGoals(); renderGoals(); closeModal(); toast(editingId ? 'Saved' : 'Goal added'); return;
    }
    // task (plan / hair / todo)
    const time = $('#fTime').value, list = currentList(), tnotes = notes || '—';
    if (editingId) Object.assign(list.find(x => x.id === editingId), { time, label, notes: tnotes });
    else list.push({ id: uid(), time, label, notes: tnotes, done: false });
    save(); renderList(); closeModal(); toast(editingId ? 'Saved' : 'Added');
  }
  function deleteCurrent() {
    if (modalKind === 'event') { const i = events.findIndex(x => x.id === editingId); if (i > -1) events.splice(i,1); saveEvents(); renderDates(); closeModal(); toast('Deleted'); return; }
    if (modalKind === 'goal')  { const a = goals[goalsPeriod]; const i = a.findIndex(x => x.id === editingId); if (i > -1) a.splice(i,1); saveGoals(); renderGoals(); closeModal(); toast('Deleted'); return; }
    const list = currentList(), i = list.findIndex(x => x.id === editingId);
    if (i > -1) list.splice(i, 1);
    save(); renderList(); closeModal(); toast('Deleted');
  }
  function resetDay() {
    if (view === 'todo') { // clear completed to-dos
      const list = currentList();
      for (let i = list.length - 1; i >= 0; i--) if (list[i].done) list.splice(i, 1);
      save(); renderList(); toast('Cleared completed');
    } else {
      currentList().forEach(t => t.done = false); save(); renderList(); toast('Day reset');
    }
  }

  /* ---- Toast ---- */
  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 1800);
  }

  /* ---- Edit mode ---- */
  function setEditMode(on) {
    editMode = on;
    $('#editToggleLabel').textContent = on ? 'Done' : 'Edit';
    renderList(); // renderList owns Add/Reset button visibility
  }

  /* ---- View switching ---- */
  function setView(v) { view = v; if (editMode) setEditMode(false); window.scrollTo(0,0); render(); }

  /* ============================================================
     WEATHER — Open-Meteo (free, no key). Cached for offline.
     ============================================================ */
  const WEATHER_KEY = 'habitTracker.weather';
  const OXFORD = { lat: 51.7520, lon: -1.2577, city: 'Oxford' };
  const WMO = {
    0:['☀️','Clear'],1:['🌤️','Mainly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],
    45:['🌫️','Fog'],48:['🌫️','Rime fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌦️','Heavy drizzle'],
    56:['🌧️','Freezing drizzle'],57:['🌧️','Freezing drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],
    66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],71:['🌨️','Light snow'],73:['❄️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],
    80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Violent showers'],85:['🌨️','Snow showers'],86:['🌨️','Snow showers'],
    95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Thunderstorm']
  };
  function paintWeather(w) {
    if (!w) return;
    const [icon, label] = WMO[w.code] || ['🌡️','Weather'];
    $('#wIcon').textContent = icon; $('#wTemp').textContent = Math.round(w.temp) + '°';
    const hl = (w.hi != null && w.lo != null) ? ` · H${Math.round(w.hi)}° L${Math.round(w.lo)}°` : '';
    $('#wMeta').textContent = (w.city || label) + hl;
    $('#weatherPill').title = `${label}${w.city ? ' · ' + w.city : ''} — updated ${new Date(w.ts).toLocaleTimeString()}`;
  }
  function getPosition() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(OXFORD);
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, city: null }),
        () => resolve(OXFORD), { timeout: 8000, maximumAge: 1800000 });
    });
  }
  async function fetchWeather() {
    if (!navigator.onLine) return;
    try {
      const pos = await getPosition();
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.lat}&longitude=${pos.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
      if (!res.ok) throw new Error('http ' + res.status);
      const d = await res.json();
      let city = pos.city;
      if (!city) { try { const g = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.lat}&longitude=${pos.lon}&localityLanguage=en`); if (g.ok) { const gj = await g.json(); city = gj.city || gj.locality || gj.principalSubdivision || null; } } catch (_) {} }
      const w = { temp: d.current.temperature_2m, code: d.current.weather_code, hi: d.daily?.temperature_2m_max?.[0], lo: d.daily?.temperature_2m_min?.[0], city: city || OXFORD.city, ts: Date.now() };
      localStorage.setItem(WEATHER_KEY, JSON.stringify(w)); paintWeather(w);
    } catch (e) {
      if (!localStorage.getItem(WEATHER_KEY)) { $('#wTemp').textContent = '--°'; $('#wMeta').textContent = 'Unavailable'; $('#wIcon').textContent = '🌡️'; }
    }
  }
  function initWeather() {
    const cached = localStorage.getItem(WEATHER_KEY);
    if (cached) { try { paintWeather(JSON.parse(cached)); } catch (_) {} }
    fetchWeather();
    $('#weatherPill').onclick = () => { $('#wIcon').textContent = '⏳'; fetchWeather().then(() => toast('Weather updated')); };
    window.addEventListener('online', fetchWeather);
    setInterval(fetchWeather, 1800000);
  }

  /* ---- Auto-pick today's tab/day ---- */
  function pickToday() {
    const d = new Date().getDay();
    if (d === 3) activeTab = 'wednesday';
    else if (d === 6) { activeTab = 'weekend'; activeDay = 'saturday'; }
    else if (d === 0) { activeTab = 'weekend'; activeDay = 'sunday'; }
    else activeTab = 'weekday';
    gymDay = ({1:'monday',2:'tuesday',4:'thursday',5:'friday'})[d] || 'monday';
  }

  /* ---- Init ---- */
  function init() {
    load(); loadEvents(); loadGoals(); pickToday();

    document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { activeTab = b.dataset.tab; renderList(); });
    document.querySelectorAll('.day-btn').forEach(b => b.onclick = () => { activeDay = b.dataset.day; renderList(); });
    document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => setView(b.dataset.view));

    $('#editToggle').onclick = () => setEditMode(!editMode);
    $('#addBtn').onclick      = () => openModal(null);
    $('#resetBtn').onclick    = resetDay;
    $('#modalClose').onclick  = closeModal;
    $('#modalSave').onclick   = saveModal;
    $('#modalDelete').onclick = deleteCurrent;
    $('#modal').onclick = (e) => { if (e.target === $('#modal')) closeModal(); };

    tickClock();
    setInterval(tickClock, 1000);
    setInterval(updateSummary, 30000);
    initWeather();
    render();
  }
  document.addEventListener('DOMContentLoaded', init);

  /* ---- Register service worker (installable + offline). No-op on file://. ---- */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  </script>
</body>
