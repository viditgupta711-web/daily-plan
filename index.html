<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#006644" />
  <title>Master Daily Plan</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="My Plan" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { forest: { DEFAULT:'#006644', dark:'#004d33', light:'#e6f2ee', mid:'#00875a' },
                  amber2: { DEFAULT:'#8a6020', light:'#fdf6e7' } },
        fontFamily: { sans: ['system-ui','-apple-system','Segoe UI','Roboto','sans-serif'] } } }
    }
  </script>
  <style>
    html, body { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior-y: contain; }
    .tabular { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .task-card { transition: opacity .25s ease, background-color .2s ease; }
    .checkbox-tick { transition: all .18s ease; }
    .modal-backdrop { backdrop-filter: blur(2px); }
    input[type=time]::-webkit-calendar-picker-indicator,
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(28%) sepia(86%) saturate(1352%) hue-rotate(135deg) brightness(94%) contrast(101%); }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .no-sb::-webkit-scrollbar { display: none; }
    summary::-webkit-details-marker { display: none; }
    summary { list-style: none; }
    details[open] .chev { transform: rotate(180deg); }
    .ring-track { stroke: rgba(255,255,255,.22); }
    .ring-prog  { transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); }
    .fld { width:100%; background:#f9fafb; border:1px solid #e5e7eb; border-radius:.75rem; padding:.7rem 1rem; font-size:16px; color:#1f2937; outline:none; }
    .fld:focus { border-color:#006644; box-shadow:0 0 0 3px rgba(0,102,68,.15); }
    .flbl { display:block; font-size:11px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.35rem; }
    .sheet { max-height: 86vh; overflow-y: auto; }
    .ph-blur { filter: blur(14px); transition: filter .25s ease; }
    .drop { transition: height .5s cubic-bezier(.4,0,.2,1); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen antialiased">

  <!-- ===================== HEADER ===================== -->
  <header class="sticky top-0 z-30 bg-forest text-white shadow-lg" style="padding-top: env(safe-area-inset-top);">
    <div class="max-w-md mx-auto px-5 pt-4 pb-4">
      <div class="flex items-start justify-between">
        <div>
          <p id="dateLabel" class="text-forest-light/80 text-xs font-medium tracking-wide uppercase">—</p>
          <h1 id="clock" class="tabular text-5xl font-bold leading-none mt-1">--:--:--</h1>
        </div>
        <div class="shrink-0 flex flex-col items-end gap-2">
          <div class="flex items-center gap-1.5">
            <button id="dataBtn" title="Export & backup" class="flex items-center justify-center w-9 h-9 bg-white/15 active:bg-white/30 text-white rounded-full transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10.75 2.75a.75.75 0 00-1.5 0v8.19L6.03 7.72a.75.75 0 00-1.06 1.06l4.5 4.5a.75.75 0 001.06 0l4.5-4.5a.75.75 0 10-1.06-1.06l-3.22 3.22V2.75z"/>
                <path d="M3.5 12.75a.75.75 0 00-1.5 0v2.5A2.75 2.75 0 004.75 18h10.5A2.75 2.75 0 0018 15.25v-2.5a.75.75 0 00-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5z"/></svg>
            </button>
            <button id="editToggle" class="flex items-center gap-1.5 bg-white/15 active:bg-white/30 text-white text-sm font-semibold px-3 py-2 rounded-full transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
              <span id="editToggleLabel">Edit</span>
            </button>
          </div>
          <button id="weatherPill" title="Tap to refresh weather" class="flex items-center gap-2 bg-white/15 active:bg-white/30 rounded-full pl-2.5 pr-3 py-1.5 transition">
            <span id="wIcon" class="text-xl leading-none">⏳</span>
            <span class="text-right leading-none">
              <span id="wTemp" class="tabular text-base font-bold text-white block leading-none">--°</span>
              <span id="wMeta" class="text-[10px] text-forest-light/90 block leading-none mt-1 whitespace-nowrap">Locating…</span>
            </span>
          </button>
        </div>
      </div>

      <div id="summaryBlock">
        <div class="mt-4 flex items-center gap-3">
          <div class="bg-white/15 rounded-xl px-3 py-2 text-center min-w-[78px]">
            <p id="remainingCount" class="tabular text-2xl font-bold leading-none">0</p>
            <p class="text-[10px] text-forest-light/90 uppercase tracking-wide mt-0.5">Remaining</p>
          </div>
          <div class="flex-1 bg-white/15 rounded-xl px-3 py-2 min-w-0">
            <p class="text-[10px] text-forest-light/90 uppercase tracking-wide">Next Up</p>
            <p id="nextTask" class="text-sm font-semibold leading-tight truncate mt-0.5">—</p>
          </div>
        </div>
        <div class="mt-3 h-1.5 bg-white/20 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-white rounded-full transition-all duration-500" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Plan day tabs -->
    <div id="dayTabs" class="max-w-md mx-auto px-3 pb-3">
      <div class="grid grid-cols-2 gap-1 bg-white/10 rounded-xl p-1">
        <button data-tab="weekday" class="tab-btn rounded-lg py-2 text-[13px] font-semibold transition">Weekdays</button>
        <button data-tab="weekend" class="tab-btn rounded-lg py-2 text-[13px] font-semibold transition">Weekend</button>
      </div>
    </div>

    <!-- Body sub-tabs -->
    <div id="bodyTabs" class="hidden max-w-md mx-auto px-3 pb-3">
      <div class="grid grid-cols-2 gap-1 bg-white/10 rounded-xl p-1">
        <button data-body="skin" class="body-btn rounded-lg py-2 text-sm font-semibold transition">✨ Skin</button>
        <button data-body="hair" class="body-btn rounded-lg py-2 text-sm font-semibold transition">💆 Hair</button>
      </div>
    </div>

    <!-- Lists sub-tabs -->
    <div id="listTabs" class="hidden max-w-md mx-auto px-3 pb-3">
      <div class="grid grid-cols-3 gap-1 bg-white/10 rounded-xl p-1">
        <button data-list="todo"  class="list-btn rounded-lg py-2 text-sm font-semibold transition">📝 To-Do</button>
        <button data-list="goals" class="list-btn rounded-lg py-2 text-sm font-semibold transition">🎯 Goals</button>
        <button data-list="dates" class="list-btn rounded-lg py-2 text-sm font-semibold transition">📅 Dates</button>
      </div>
    </div>
  </header>

  <!-- ===================== MAIN ===================== -->
  <main class="max-w-md mx-auto px-4 pt-4 pb-28">
    <div id="ringWidget" class="hidden mb-3"></div>
    <div id="waterWidget" class="hidden mb-4"></div>

    <section id="view-list">
      <div class="flex items-center justify-between mb-3 px-1">
        <p id="listTitle" class="text-xs font-bold uppercase tracking-wider text-gray-400">Schedule</p>
        <button id="resetBtn" class="flex items-center gap-1 text-xs font-semibold text-forest active:text-forest-dark">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
          <span id="resetLabel">Reset Day</span>
        </button>
      </div>
      <p id="dayNote" class="hidden text-[11px] text-gray-500 leading-snug mb-3 px-1 bg-gray-100 rounded-lg p-2.5"></p>
      <div id="taskList" class="space-y-2.5"></div>
      <button id="addBtn" class="hidden mt-4 w-full border-2 border-dashed border-forest/40 text-forest font-semibold py-3.5 rounded-2xl active:bg-forest-light transition flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
        <span id="addBtnLabel">Add Task</span>
      </button>
      <p id="emptyState" class="hidden text-center text-gray-400 text-sm py-16">No items yet. Tap “Add” to begin.</p>
    </section>

    <section id="view-hard"   class="hidden"></section>
    <section id="view-gym"    class="hidden"></section>
    <section id="view-diet"   class="hidden"></section>
    <section id="view-skin"   class="hidden"></section>
    <section id="view-hair"   class="hidden"></section>
    <section id="view-photos" class="hidden"></section>
    <section id="view-bench"  class="hidden"></section>
    <section id="view-goals"  class="hidden"></section>
    <section id="view-dates"  class="hidden"></section>
  </main>

  <!-- ===================== BOTTOM NAV ===================== -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-gray-200" style="padding-bottom: env(safe-area-inset-bottom);">
    <div class="max-w-md mx-auto flex overflow-x-auto no-sb scroll-smooth">
      <button data-view="plan"   class="nav-btn"><span class="text-xl leading-none">🗓️</span><span class="text-[10px] font-semibold">Plan</span></button>
      <button data-view="lists"  class="nav-btn"><span class="text-xl leading-none">📋</span><span class="text-[10px] font-semibold">Lists</span></button>
      <button data-view="gym"    class="nav-btn"><span class="text-xl leading-none">🏋️</span><span class="text-[10px] font-semibold">Gym</span></button>
      <button data-view="body"   class="nav-btn"><span class="text-xl leading-none">🧴</span><span class="text-[10px] font-semibold">Body</span></button>
      <button data-view="hard"   class="nav-btn"><span class="text-xl leading-none">🔥</span><span class="text-[10px] font-semibold">75</span></button>
      <button data-view="diet"   class="nav-btn"><span class="text-xl leading-none">🍴</span><span class="text-[10px] font-semibold">Diet</span></button>
      <button data-view="photos" class="nav-btn"><span class="text-xl leading-none">📸</span><span class="text-[10px] font-semibold">Photos</span></button>
      <button data-view="bench"  class="nav-btn"><span class="text-xl leading-none">📈</span><span class="text-[10px] font-semibold">Bench</span></button>
    </div>
  </nav>

  <!-- ===================== TASK / EVENT / GOAL MODAL ===================== -->
  <div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop bg-black/40 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl" style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));">
      <div class="flex items-center justify-between mb-4">
        <h2 id="modalTitle" class="text-lg font-bold text-gray-800">Edit Task</h2>
        <button id="modalClose" class="text-gray-400 active:text-gray-600 p-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>
      <div class="space-y-4">
        <div id="fTimeRow"><label class="flbl">Time <span class="text-gray-300 normal-case">(optional)</span></label><input id="fTime" type="time" class="fld" /></div>
        <div id="fDateRow" class="hidden"><label class="flbl">Date</label><input id="fDate" type="date" class="fld" /></div>
        <div id="fOnlyRow" class="hidden"><label class="flbl">Shows on</label>
          <select id="fOnly" class="fld">
            <option value="">Every weekday</option>
            <option value="gym">Training days only — Tue · Wed · Fri</option>
            <option value="rest">Rest days only — Mon · Thu</option>
          </select></div>
        <div><label class="flbl">Name</label><input id="fLabel" type="text" placeholder="e.g. Meditation" class="fld" /></div>
        <div><label class="flbl">Notes</label><textarea id="fNotes" rows="2" placeholder="Optional details…" class="fld resize-none"></textarea></div>
      </div>
      <div class="flex gap-3 mt-6">
        <button id="modalDelete" class="hidden flex-1 bg-red-50 text-red-600 font-semibold py-3.5 rounded-xl active:bg-red-100 transition">Delete</button>
        <button id="modalSave" class="flex-[2] bg-forest text-white font-semibold py-3.5 rounded-xl active:bg-forest-dark transition shadow-md shadow-forest/30">Save</button>
      </div>
    </div>
  </div>

  <!-- ===================== GENERIC RECORD EDITOR ===================== -->
  <div id="recModal" class="hidden fixed inset-0 z-50 modal-backdrop bg-black/40 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl sheet" style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));">
      <div class="flex items-center justify-between mb-4">
        <h2 id="recTitle" class="text-lg font-bold text-gray-800">Edit</h2>
        <button id="recClose" class="text-gray-400 active:text-gray-600 p-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>
      <div id="recFields" class="space-y-3.5"></div>
      <div id="recMove" class="hidden gap-2 mt-4 grid-cols-2">
        <button id="recUp"   class="bg-gray-100 text-gray-600 text-sm font-semibold py-2.5 rounded-xl active:bg-gray-200">↑ Move up</button>
        <button id="recDown" class="bg-gray-100 text-gray-600 text-sm font-semibold py-2.5 rounded-xl active:bg-gray-200">↓ Move down</button>
      </div>
      <div class="flex gap-3 mt-4">
        <button id="recDelete" class="hidden flex-1 bg-red-50 text-red-600 font-semibold py-3.5 rounded-xl active:bg-red-100 transition">Delete</button>
        <button id="recSave" class="flex-[2] bg-forest text-white font-semibold py-3.5 rounded-xl active:bg-forest-dark transition shadow-md shadow-forest/30">Save</button>
      </div>
    </div>
  </div>

  <!-- ===================== PHOTO VIEWER ===================== -->
  <div id="photoModal" class="hidden fixed inset-0 z-[55] bg-black/90 flex flex-col">
    <div class="flex items-center justify-between p-4 text-white" style="padding-top: calc(1rem + env(safe-area-inset-top));">
      <p id="photoTitle" class="text-sm font-semibold">Photo</p>
      <button id="photoClose" class="p-1"><svg class="w-7 h-7" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg></button>
    </div>
    <div id="photoBody" class="flex-1 overflow-auto px-3 pb-6"></div>
  </div>

  <!-- ===================== DATA / EXPORT SHEET ===================== -->
  <div id="dataModal" class="hidden fixed inset-0 z-50 modal-backdrop bg-black/40 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl sheet" style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-lg font-bold text-gray-800">Data</h2>
        <button id="dataClose" class="text-gray-400 active:text-gray-600 p-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>
      <p class="text-xs text-gray-400 leading-relaxed mb-4">Everything lives on this device. The ZIP is the complete backup — the JSON alone does not carry photos.</p>
      <div class="space-y-2.5">
        <button id="btnZip"  class="w-full bg-forest text-white font-semibold py-3.5 rounded-xl active:bg-forest-dark transition shadow-md shadow-forest/30">⇩ Export everything (.zip)</button>
        <button id="btnXlsx" class="w-full bg-gray-100 text-gray-700 font-semibold py-3.5 rounded-xl active:bg-gray-200 transition">⇩ Spreadsheet only (.xlsx)</button>
        <button id="btnJson" class="w-full bg-gray-100 text-gray-700 font-semibold py-3.5 rounded-xl active:bg-gray-200 transition">⇩ Backup without photos (.json)</button>
        <button id="btnRestore" class="w-full bg-gray-100 text-gray-700 font-semibold py-3.5 rounded-xl active:bg-gray-200 transition">⇧ Restore from backup</button>
        <input id="fileRestore" type="file" accept="application/json,.json" class="hidden" />
        <div id="storageInfo" class="text-[11px] text-gray-400 text-center pt-1"></div>
        <button id="btnSeed" class="w-full text-amber2 text-sm font-semibold py-3 active:opacity-70">↺ Restore built-in content defaults</button>
        <button id="btnWipe" class="w-full text-red-500 text-sm font-semibold py-3 active:text-red-700">⚠ Erase everything on this device</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-[60] bg-gray-900 text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-xl max-w-[92vw] text-center"></div>

  <script>
  /* ==================================================================
     MASTER DAILY PLAN v3
     Source of truth: Vidit_75_Hard_Tracker_v2 · Vidit_PPL_Program ·
     Vidit_Diet_Block · Vidit_Skin_Hair_Master_Routine  (all Aug 2026)
     Day 1 = Mon 3 Aug 2026 · Day 75 = Fri 16 Oct 2026
     ================================================================== */

  const SK = {
    content : 'habitTracker.content.v3',
    archive2: 'habitTracker.content.v2.archived',
    archive3: 'habitTracker.content.v3.archived',
    old2    : 'habitTracker.content.v2',
    legacy  : 'habitTracker.v1',
    day     : 'habitTracker.lastDay',
    habits  : 'habitTracker.habits',
    gymlog  : 'habitTracker.gymlog',
    events  : 'habitTracker.events',
    goals   : 'habitTracker.goals',
    hardlog : 'habitTracker.hardlog.v3',
    hardOld : 'habitTracker.hardlog',
    hardmeta: 'habitTracker.hardmeta.v3',
    water   : 'habitTracker.waterlog',
    bench   : 'habitTracker.benchlog.v3',
    photoIx : 'habitTracker.photoindex',
    weather : 'habitTracker.weather',
    prefs   : 'habitTracker.prefs'
  };
  const START = '2026-08-03';   // Day 1 — Monday
  const LENGTH = 75;
  const CONTENT_V = 4;          // bump when seeded PLAN content must replace what's stored

  const SEED = {};

  /* ---------------- Schedules — from the Master Daily Routine ----------------
     One weekday list. The 5th field is "only": '' = every weekday,
     'gym' = Mon/Tue/Thu/Fri, 'wed' = Wednesday (rest day). The Plan tab swaps
     the morning block automatically, so there is no separate Wednesday tab. */
  SEED.schedules = {
    weekday: [
      ['04:30','Wake · bullet coffee + 1 tbsp ghee','500 ml water · Rules 2 & 3','amber',''],
      ['05:00','Meditation','20 minutes · Rule 4','teal',''],
      ['05:20','Journal, longhand and slow','This is the handwriting practice · Rule 4','teal',''],
      ['05:40','Pack bag · gym kit · SPF in the bag','','','gym'],
      ['05:40','Shoes on · layers','No gym kit today — walking','','rest'],
      ['05:45','Walk to Gosford (8 min)','250 ml water · Rule 3','teal','gym'],
      ['05:45','45-MINUTE OUTDOOR WALK','Rest day. Ticks Rule 1 — the streak holds. Morning, so the evening stays protected.','teal','rest'],
      ['06:00','TRAIN — see the Gym tab','600 ml during · Rule 1','teal','gym'],
      ['06:30','Home','','','rest'],
      ['06:45','Walk home','','','gym'],
      ['06:53','Shower','Hair: wash Mon · Thu · Sat — rinse other days','purple','gym'],
      ['06:53','Shower','Rinse only on a rest day — no shampoo','purple','rest'],
      ['07:02','AM skincare','Moisturiser → SPF 50. Vitamin C 2–3×/wk, optional','purple',''],
      ['07:05','Meal — shake + banana + eggs + toast','Supplements. 400 ml water. Tue: no egg · Rules 2 & 3','amber',''],

  /* ============================ 75-HARD MATHS ============================ */
  function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000); }
  function hardDayFor(ds) { return daysBetween(hardMeta ? hardMeta.start : START, ds) + 1; }
  function hardDayNum() { return hardDayFor(todayStr()); }
  function hardDateFor(n) { const d = new Date((hardMeta ? hardMeta.start : START) + 'T00:00'); d.setDate(d.getDate() + n - 1); return dstr(d); }
  function phaseFor(n) { return (C.phases || []).find(p => n >= p.from && n <= p.to) || (C.phases || [])[0]; }
  function trainPhaseFor(n) { return (C.trainPhases || []).find(p => n >= p.from && n <= p.to) || (C.trainPhases || [])[0]; }
  function commsFor(n) { return (C.comms || []).find(x => x.d === n) || null; }
  function hardDay(ds) { const e = hardLog[ds]; return (e && e.t) ? e : { t:{}, note:'' }; }
  function hardCount(ds) { const t = hardDay(ds).t; return C.hardTasks.reduce((a,x) => a + (t[x.key] ? 1 : 0), 0); }
  function hardComplete(ds) { return hardCount(ds) === C.hardTasks.length; }
  function setHardTask(ds, key, on) {
    if (!hardLog[ds]) hardLog[ds] = { t:{}, note:'' };
    if (!hardLog[ds].t) hardLog[ds].t = {};
    if (on) hardLog[ds].t[key] = 1; else delete hardLog[ds].t[key];
    saveHardLog();
  }
  function toggleHardTask(ds, key) { setHardTask(ds, key, !hardDay(ds).t[key]); }
  function missedDays() {
    const out = [], n = Math.min(hardDayNum() - 1, hardMeta.length);
    for (let i = 1; i <= n; i++) { const ds = hardDateFor(i); if (!hardComplete(ds)) out.push({ n:i, ds, done: hardCount(ds) }); }
    return out;
  }
  function restartHard() {
    hardMeta.history.push({ attempt: hardMeta.attempt, start: hardMeta.start, endedOn: todayStr(), reached: Math.max(0, hardDayNum() - 1) });
    hardMeta.attempt += 1; hardMeta.start = todayStr(); saveHardMeta();
    toast('Restarted — attempt ' + hardMeta.attempt + ', Day 1. History kept.');
    render();
  }
  /* Streaks over the ten boxes */
  function isWin(ds) { return hardCount(ds) >= (C.threshold || 10); }
  function currentStreak() { let s=0; for (let i=0;i<400;i++){ const d=dateNAgo(i); if(isWin(d))s++; else { if(i===0) continue; break; } } return s; }
  function bestStreak() { let best=0,run=0; for (let i=400;i>=0;i--){ if(isWin(dateNAgo(i))){ run++; if(run>best)best=run; } else run=0; } return best; }
  function taskStreak(key) { let s=0; for (let i=0;i<400;i++){ const d=dateNAgo(i); if(hardDay(d).t[key])s++; else { if(i===0) continue; break; } } return s; }

  /* ============================ SURGICAL CLAUSE ============================ */
  function surgicalWindow(n) { return n >= 40 && n <= 54; }
  function inSurgical() { const n = hardDayNum(); return surgicalWindow(n); }
  function surgicalStage(n) {
    if (n < 40) return 'pre';
    if (n <= 47) return 'rest';      // 11–18 Sep — nothing
    if (n <= 54) return 'walk';      // 19–24 Sep — walking if cleared
    return 'post';
  }
  /* Rule text bends inside the window. Everything else holds. */
  function ruleSubFor(task, n) {
    if (!surgicalWindow(n)) return task.sub;
    if (task.key === 'work') {
      const st = surgicalStage(n);
      if (st === 'rest') return 'SURGICAL CLAUSE — no lifting, no straining. Gentle movement around the house only. Complete rest on medical instruction is not a miss; tick it.';
      return prefs.clearedToWalk
        ? 'SURGICAL CLAUSE — walking, cleared. Start 10–15 min and build. Flat ground. Stop if anything throbs.'
        : 'SURGICAL CLAUSE — walking once the surgeon clears it. Until then, complete rest. Resting on medical instruction is not a miss; tick it.';
    }
    if (task.key === 'water') return 'SURGICAL CLAUSE — hydration as tolerated, sipping constantly. Ignore the 18:00 taper for this fortnight. Dehydration makes the throat hurt more, which makes you drink less.';
    if (task.key === 'diet')  return 'SURGICAL CLAUSE — maintenance or slightly above. No deficit, no tracking, no weighing. Protein 100–120 g is a win, not a failure.';
    if (task.key === 'comms') return 'SURGICAL CLAUSE — silent drafting only. Nothing spoken aloud. Sunday voice memos become written reviews.';
    return task.sub;
  }

  function openRec(specKey, idx, extra) {

  function readFields(fields, rec) {

      const el = document.getElementById('rf-' + f.k);

      else if (f.t === 'lines') rec[f.k] = el.value.split('\n').map(s => s.trim()).filter(Boolean);

      const tmp = { v: recIdx > -1 ? arr[recIdx] : '' };
      readFields(fields, tmp);
      if (recIdx > -1) arr[recIdx] = tmp.v; else arr.push(tmp.v);
    } else {
      const rec = recIdx > -1 ? arr[recIdx] : ((recExtra && recExtra.blank) ? recExtra.blank() : sp.blank());
      readFields(fields, rec);
      if (recIdx < 0) arr.push(rec);

  /* ============================ RING + WATER WIDGETS ============================ */
  function ringSvg(size, frac, colour, big, small) {
    const r = size/2 - 9, cx = size/2, cir = 2*Math.PI*r;
    const off = cir * (1 - Math.max(0, Math.min(1, frac)));
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="shrink-0">
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke-width="9" class="ring-track"/>
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${colour}" stroke-width="9" stroke-linecap="round"
        class="ring-prog" stroke-dasharray="${cir.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${cx} ${cx})"/>
      <text x="${cx}" y="${cx-2}" text-anchor="middle" font-size="${size*0.26}" font-weight="800" fill="currentColor" class="tabular">${big}</text>
      <text x="${cx}" y="${cx+size*0.17}" text-anchor="middle" font-size="${size*0.095}" font-weight="700" fill="currentColor" opacity=".62">${small}</text></svg>`;
  }
  function hardStatus() {
    const L = hardMeta.length, n = hardDayNum();
    if (n < 1) return { state:'pending', n, L, remaining:L, label:'Starts ' + prettyDate(hardMeta.start) };
    if (n > L) return { state:'done', n:L, L, remaining:0, label:'Complete — ' + L + ' days' };
    return { state:'live', n, L, remaining: L - n, label:'Day ' + n + ' of ' + L };
  }
  function sessionForDate(ds) {
    const key = C.splitMap[String(dow(ds))] || C.splitMap[dow(ds)];
    return C.gym.find(g => g.key === key) || null;
  }

    const st = hardStatus(), n = Math.max(1, Math.min(st.n, st.L));
    const ph = phaseFor(n), tp = trainPhaseFor(n);

    const frac = st.state === 'live' ? st.remaining/st.L : (st.state === 'done' ? 0 : 1);
    const big  = st.state === 'live' ? String(st.remaining) : (st.state === 'done' ? '✓' : String(st.L));
    const cm = commsFor(n), sess = sessionForDate(ds);
    const surg = st.state === 'live' && surgicalWindow(n);
    const col = surg ? '#8a6020' : ph.col;
    $('#ringWidget').innerHTML = `
      <div onclick="setView('hard')" class="cursor-pointer active:opacity-90 rounded-2xl p-4 text-white shadow-lg flex items-center gap-4" style="background:linear-gradient(135deg,${col},${col}cc)">

          <p class="text-[11px] opacity-90 mt-1.5">${done}/${total} boxes${sess?' · '+esc(sess.label):''}${cm?' · '+esc(cm.code):''}</p>
        </div><span class="opacity-70 text-xl">›</span></div>`;

  const ytSearch = (n) => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(n + ' proper form technique');

  /* ============================ GYM ============================ */
  function setGymDay(k) { gymDay = k; renderGym(); }
  function gymIdx() { const i = C.gym.findIndex(d => d.key === gymDay); return i > -1 ? i : 0; }

  function saveGymLog(di, ei) {
    const ex = C.gym[di].exs[ei], sets = [];

  /* Rough clock: ~2 min per working set, plus a 5-minute warm-up. Not gospel —
     it exists so you find out a session overruns before you are standing in it. */
  function sessionMinutes(d) {
    const sets = (d.exs || []).reduce((a, ex) => a + (parseInt(ex.sets) || 0), 0);
    return { sets, mins: sets ? 5 + sets * 2 : 0 };
  }
  function slotMinutes(d) {
    const m = String(d.time || '').match(/(\d+):(\d+)[–-](\d+):(\d+)/);
    if (!m) return null;
    return (+m[3] * 60 + +m[4]) - (+m[1] * 60 + +m[2]);
  }

  function renderGym() {

            <p class="text-[11px] font-bold uppercase tracking-wide text-gray-400 mt-4 mb-1">Muscles worked</p>
            <div class="bg-gray-50 rounded-2xl py-2">${bodySVG(ex.pri, ex.sec)}</div>

        });
        h += '</div>';
      });
      h += '</div>';
    }
    h += creedBox();
    $('#view-gym').innerHTML = h;
  }
  function recentGym(days) {
    const all = getGymLogs(), cut = new Date(); cut.setDate(cut.getDate() - days);
    const byDate = {};
    Object.keys(all).forEach(k => {
      const date = k.split('||')[0], name = k.slice(date.length + 2);
      if (new Date(date + 'T12:00') >= cut) (byDate[date] = byDate[date] || []).push({ name, sets: all[k] });
    });
    return Object.keys(byDate).sort().reverse().map(date => ({ date, label: prettyDate(date), items: byDate[date] }));
  }

  /* ============================ DIET ============================ */
  function setDietTab(k) { dietTab = k; renderDiet(); }
  function renderDiet() {
    const st = hardStatus(), n = Math.max(1, Math.min(st.n, st.L));
    const surg = st.state === 'live' && surgicalWindow(n);
    const preop = st.state === 'live' && n >= 33 && n <= 39;
    const isTue = new Date().getDay() === 2;
    const D = C.diet;

    let h = '';
    if (surg) h += `<div class="rounded-2xl border-2 border-amber-300 bg-amber-50 p-4 mb-3">

    else if (preop) h += `<div class="rounded-2xl border-2 border-amber-300 bg-amber-50 p-4 mb-3">

    const tot = D.standard.reduce((a,r) => ({ k:a.k+(r.k||0), p:a.p+(r.p||0), c:a.c+(r.c||0), f:a.f+(r.fa||0) }), {k:0,p:0,c:0,f:0});

  /* ============================ PHOTOS ============================ */
  const PH_KINDS = [{k:'face', l:'Face', icon:'🙂'}, {k:'body', l:'Body', icon:'🧍'}];
  function photoOutline(kind) {
    return kind === 'face'
      ? '<ellipse cx="50" cy="46" rx="24" ry="31" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" opacity=".85"/><path d="M30 88 Q50 78 70 88" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" opacity=".85"/>'
      : '<line x1="26" y1="24" x2="74" y2="24" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" opacity=".85"/><line x1="34" y1="60" x2="66" y2="60" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" opacity=".85"/><line x1="50" y1="10" x2="50" y2="94" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 4" opacity=".55"/>';
  }
  async function shrink(file, max) {
    max = max || 900;
    return new Promise((res) => {
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const sc = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          res(cv.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = () => res('');
        img.src = fr.result;
      };
      fr.onerror = () => res('');
      fr.readAsDataURL(file);
    });
  }
  async function onPhotoPick(input, ds, kind) {
    const f = input.files && input.files[0]; if (!f) return;
    const data = await shrink(f);
    if (!data) { toast('Could not read that image'); return; }
    try { await IDB.put(photoKey(ds, kind), { date: ds, kind, data, ts: Date.now(), bytes: data.length }); }
    catch (e) { toast('Photo storage unavailable on this browser'); return; }
    photoIx[photoKey(ds, kind)] = { date: ds, kind, ts: Date.now(), bytes: data.length };
    savePhotoIx();
    // Both taken -> Rule 8 ticks itself
    const both = photoIx[photoKey(ds,'face')] && photoIx[photoKey(ds,'body')];
    setHardTask(ds, 'photo', !!both);
    renderPhotos(); toast(kind === 'face' ? 'Face photo saved' : 'Body photo saved');
  }
  async function deletePhoto(ds, kind) {
    if (!confirm('Delete the ' + kind + ' photo for ' + prettyDate(ds) + '?')) return;
    try { await IDB.del(photoKey(ds, kind)); } catch (e) {}
    delete photoIx[photoKey(ds, kind)]; savePhotoIx();
    setHardTask(ds, 'photo', false);
    closePhoto(); renderPhotos(); toast('Deleted');
  }
  async function viewPhoto(ds, kind) {
    const rec = await IDB.get(photoKey(ds, kind)).catch(() => null);
    if (!rec) { toast('Photo not found'); return; }
    const dn = hardDayFor(ds);
    $('#photoTitle').textContent = (dn >= 1 && dn <= hardMeta.length ? 'Day ' + dn + ' · ' : '') + prettyDate(ds) + ' · ' + kind;

  async function openCompare() {
    const days = photoDays();
    if (days.length < 2) { toast('Two days of photos needed to compare'); return; }
    cmpA = cmpA || days[0]; cmpB = cmpB || days[days.length-1];
    const [a, b] = await Promise.all([IDB.get(photoKey(cmpA, cmpKind)).catch(()=>null), IDB.get(photoKey(cmpB, cmpKind)).catch(()=>null)]);
    const opt = (sel) => days.map(d => { const dn = hardDayFor(d); return `<option value="${d}" ${d===sel?'selected':''}>${dn>=1&&dn<=hardMeta.length?'Day '+dn+' · ':''}${shortDate(d)}</option>`; }).join('');

        <div><select onchange="cmpA=this.value;openCompare()" class="w-full bg-white/10 text-white text-xs rounded-lg p-2 mb-2">${opt(cmpA)}</select>
          ${a?`<img src="${a.data}" class="w-full rounded-xl" alt="">`:'<p class="text-white/50 text-xs text-center py-10">No '+cmpKind+' photo</p>'}</div>
        <div><select onchange="cmpB=this.value;openCompare()" class="w-full bg-white/10 text-white text-xs rounded-lg p-2 mb-2">${opt(cmpB)}</select>

      </div>
      <p class="text-white/40 text-[11px] text-center mt-3 leading-relaxed">Same spot, same light, same time — otherwise you are comparing the lighting, not yourself.</p>`;
    $('#photoModal').classList.remove('hidden');

        <div class="relative aspect-[3/4] bg-gray-100 flex items-center justify-center">
          ${have ? `<img data-ph="${photoKey(ds,k.k)}" class="absolute inset-0 w-full h-full object-cover ${blur?'ph-blur':''}" alt="">`

  /* ============================ BENCH ============================ */
  function chartLine(pts, colour, unit, invert) {
    const vals = pts.filter(p => p.v != null);
    if (vals.length < 2) return `<p class="text-xs text-gray-400 py-6 text-center">Two entries needed before a trend means anything.</p>`;
    const W = 300, H = 96, P = 10;
    const xs = vals.map((p,i) => P + i * ((W - 2*P) / (vals.length - 1)));
    const lo = Math.min(...vals.map(p=>p.v)), hi = Math.max(...vals.map(p=>p.v));
    const span = (hi - lo) || 1;
    const ys = vals.map(p => H - P - ((p.v - lo)/span) * (H - 2*P));
    const d = xs.map((x,i) => (i?'L':'M') + x.toFixed(1) + ' ' + ys[i].toFixed(1)).join(' ');
    const first = vals[0].v, last = vals[vals.length-1].v, delta = Math.round((last - first)*10)/10;
    const good = invert ? delta < 0 : delta > 0;
    return `<svg viewBox="0 0 ${W} ${H}" class="w-full">
        <path d="${d}" fill="none" stroke="${colour}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${xs.map((x,i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="2.8" fill="${colour}"/>`).join('')}</svg>
      <div class="flex justify-between text-[11px] text-gray-400 mt-1">
        <span>${first}${unit}</span>
        <span class="font-bold ${delta===0?'text-gray-400':good?'text-emerald-600':'text-red-500'}">${delta>0?'+':''}${delta}${unit}</span>
        <span>${last}${unit}</span></div>`;
  }
  function waistStalled() {
    const done = bench.filter(b => b.waist != null && !surgicalWindow(b.day == null ? hardDayFor(b.date) : b.day)).sort((a,b)=>a.date.localeCompare(b.date));
    if (done.length < 5) return 0;
    const last5 = done.slice(-5);
    return Math.abs(last5[4].waist - last5[0].waist) < 0.25 ? last5.length : 0;
  }

  /* ============================ GOALS & DATES ============================ */
  function startOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d; }
  function endOfPeriod(p) {
    const d = new Date(); d.setHours(23,59,59,999);
    if (p === 'week') { const dw = (d.getDay()+6)%7; d.setDate(d.getDate() + (6-dw)); }
    else if (p === 'month') d.setMonth(d.getMonth()+1, 0);
    else d.setMonth(11, 31);
    return d;
  }
  function dayDiff(ds) { return Math.round((new Date(ds + 'T00:00') - startOfToday()) / 86400000); }
  function countdown(ds) {
    const n = dayDiff(ds);
    if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
    if (n > 1) { if (n < 7) return 'in ' + n + ' days'; if (n < 14) return 'in 1 week'; if (n < 31) return 'in ' + Math.round(n/7) + ' weeks'; if (n < 60) return 'in 1 month'; return 'in ' + Math.round(n/30) + ' months'; }
    const m = -n; if (m < 7) return m + ' days ago'; if (m < 31) return Math.round(m/7) + ' weeks ago'; return Math.round(m/30) + ' months ago';
  }
  const periodToggle = (which, cur) => {
    const fn = which === 'dates' ? 'setDatesPeriod' : 'setGoalsPeriod';
    return '<div class="flex gap-1 bg-gray-100 rounded-xl p-1 mb-1">' + [['week','Week'],['month','Month'],['year','Year']].map(([k,l]) =>
      `<button onclick="${fn}('${k}')" class="flex-1 rounded-lg py-2 text-sm font-semibold transition ${k===cur?'bg-forest text-white shadow':'text-gray-500 active:bg-gray-200'}">${l}</button>`).join('') + '</div>';
  };
  function setDatesPeriod(p) { datesPeriod = p; renderDates(); }
  function setGoalsPeriod(p) { goalsPeriod = p; renderGoals(); }
  function eventCard(e) {
    const n = dayDiff(e.date), isToday = n === 0, over = n < 0;
    const chip = over ? 'bg-red-50 text-red-600' : isToday ? 'bg-forest text-white' : 'bg-forest-light text-forest';
    const d = new Date(e.date + 'T00:00');
    return `<div onclick="openEventModal('${e.id}')" class="bg-white rounded-2xl shadow-sm border ${isToday?'border-forest':'border-gray-100'} px-4 py-3 mb-2.5 flex items-center gap-3 cursor-pointer active:bg-gray-50">
      <div class="shrink-0 w-12 text-center"><p class="text-[10px] font-bold uppercase text-gray-400 leading-none">${d.toLocaleDateString(undefined,{month:'short'})}</p>
        <p class="tabular text-xl font-bold text-gray-800 leading-tight">${d.getDate()}</p></div>
      <div class="flex-1 min-w-0"><p class="font-semibold text-[15px] text-gray-800 leading-snug">${esc(e.title)}</p>
        ${e.note?`<p class="text-xs text-gray-400 leading-snug mt-0.5">${esc(e.note)}</p>`:''}</div>
      <span class="shrink-0 text-[10px] font-bold px-2 py-1 rounded-full ${chip}">${countdown(e.date)}</span></div>`;
  }
  function renderDates() {
    let h = periodToggle('dates', datesPeriod);
    const start = startOfToday(), end = endOfPeriod(datesPeriod);
    const sorted = [...events].sort((a,b) => a.date.localeCompare(b.date));
    const overdue = sorted.filter(e => dayDiff(e.date) < 0);
    const within = sorted.filter(e => { const t = new Date(e.date + 'T00:00'); return t >= start && t <= end; });
    if (overdue.length) { h += secTitle('⚠ Past'); h += overdue.map(eventCard).join(''); }
    h += secTitle({week:'This Week',month:'This Month',year:'This Year'}[datesPeriod]);
    h += within.length ? within.map(eventCard).join('') : `<p class="text-center text-gray-400 text-sm py-10">Nothing ${{week:'this week',month:'this month',year:'this year'}[datesPeriod]}.</p>`;
    h += addBtnHtml('Add Event', 'openEventModal(null)');
    $('#view-dates').innerHTML = h;
  }
  function toggleGoal(id) { const it = goals[goalsPeriod].find(x => x.id === id); if (it) { it.done = !it.done; saveGoals(); renderGoals(); } }
  function renderGoals() {
    let h = periodToggle('goals', goalsPeriod);
    const list = goals[goalsPeriod] || [];
    const done = list.filter(x => x.done).length, pct = list.length ? Math.round(done/list.length*100) : 0;
    h += `<div class="flex items-center justify-between mt-4 mb-2 px-1"><p class="text-xs font-bold uppercase tracking-wider text-gray-400">${{week:'This Week',month:'This Month',year:'This Year'}[goalsPeriod]} · ${done}/${list.length}</p></div>`;
    h += `<div class="h-1.5 bg-gray-200 rounded-full overflow-hidden mb-3"><div class="h-full bg-forest rounded-full transition-all duration-500" style="width:${pct}%"></div></div>`;
    if (!list.length) h += '<p class="text-center text-gray-400 text-sm py-10">No goals yet.</p>';
    else [...list].sort((a,b) => (a.done?1:0)-(b.done?1:0)).forEach(g => {

        <div class="flex-1 min-w-0" onclick="openGoalModal('${g.id}')"><p class="text-[15px] font-semibold leading-snug ${g.done?'line-through text-gray-400':'text-gray-800'}">${esc(g.text)}</p>

  /* ==================================================================
     EXPORT — dependency-free ZIP + XLSX. Works offline.
     ================================================================== */
  const CRC_T = (() => { const t = new Uint32Array(256);
    for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
  function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
  const enc = new TextEncoder();
  function b64ToU8(b64) {
    const bin = atob(b64); const u = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function zipStore(files) {
    const parts = [], central = []; let offset = 0;
    const u16 = n => [n&255,(n>>>8)&255];
    const u32 = n => [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
    files.forEach(f => {
      const name = enc.encode(f.name), data = f.data, crc = crc32(data);
      const lh = [].concat([0x50,0x4b,0x03,0x04],u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
      parts.push(new Uint8Array(lh), name, data);
      central.push({ name, crc, len:data.length, offset });
      offset += lh.length + name.length + data.length;
    });
    const cd = [];
    central.forEach(c => {
      const h = [].concat([0x50,0x4b,0x01,0x02],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c.crc),u32(c.len),u32(c.len),u16(c.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.offset));
      cd.push(new Uint8Array(h), c.name);
    });
    const cdBytes = cd.reduce((a,x)=>a+x.length,0);
    const eocd = new Uint8Array([].concat([0x50,0x4b,0x05,0x06],u16(0),u16(0),u16(files.length),u16(files.length),u32(cdBytes),u32(offset),u16(0)));
    const all = parts.concat(cd,[eocd]);
    const out = new Uint8Array(all.reduce((a,x)=>a+x.length,0));
    let p = 0; all.forEach(x => { out.set(x,p); p += x.length; });
    return out;
  }
  const xe = (s) => String(s==null?'':s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
  function colRef(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
  function sheetXml(rows) {
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    rows.forEach((row,r) => {
      x += '<row r="'+(r+1)+'">';
      row.forEach((v,c) => {
        const ref = colRef(c)+(r+1);
        if (typeof v === 'number' && isFinite(v)) x += '<c r="'+ref+'"><v>'+v+'</v></c>';
        else if (v === '' || v == null) {}
        else x += '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xe(v)+'</t></is></c>';
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  }
  function buildXlsx(sheets) {
    const files = [];
    const names = sheets.map(s => s.name.replace(/[\[\]\*\?\/\\:]/g,'').slice(0,31));
    files.push({ name:'[Content_Types].xml', data: enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>') });
    files.push({ name:'_rels/.rels', data: enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') });
    files.push({ name:'xl/workbook.xml', data: enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      names.map((n,i)=>'<sheet name="'+xe(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('') + '</sheets></workbook>') });
    files.push({ name:'xl/_rels/workbook.xml.rels', data: enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('') + '</Relationships>') });
    sheets.forEach((s,i) => files.push({ name:'xl/worksheets/sheet'+(i+1)+'.xml', data: enc.encode(sheetXml(s.rows)) }));
    return zipStore(files);
  }
  function download(data, filename, mime) {
    const blob = new Blob([data], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }

  function collectSheets() {
    const S = [], total = C.hardTasks.length, hk = C.hardTasks.map(t => t.key);

    const hard = [['Day','Date','Weekday','Phase','TrainingPhase','Split','SurgicalWindow','CommsCode','CommsWatch','CommsApply']
      .concat(C.hardTasks.map(t => t.label)).concat(['Completed','BoxesDone','TotalBoxes','WaterMl','WinOfTheDay'])];
    for (let i = 1; i <= hardMeta.length; i++) {
      const ds = hardDateFor(i), e = hardDay(ds), cm = commsFor(i) || {}, ph = phaseFor(i), tp = trainPhaseFor(i), sess = sessionForDate(ds);
      hard.push([i, ds, new Date(ds+'T12:00').toLocaleDateString('en-GB',{weekday:'long'}), ph.name, tp.key+' '+tp.name, sess?sess.label:'', surgicalWindow(i)?1:0, cm.code||'', cm.watch||'', cm.apply||'']
        .concat(hk.map(k => e.t[k]?1:0))
        .concat([hardComplete(ds)?1:0, hardCount(ds), total, waterMl(ds), e.note||'']));
    }
    S.push({ name:'75HardLog', rows: hard });

    const b = [['Day','Date','SurgicalWindow','WaistIn','WeightKg','TypingWPM','TypingAccPct','BenchKg','OHPKg','PulldownKg','RowKg','HandwritingNote','CommsNote']];
    [...bench].sort((x,y)=>(x.date||'').localeCompare(y.date||'')).forEach(r => {
      const dn = r.day == null ? hardDayFor(r.date) : r.day;
      b.push([dn, r.date, surgicalWindow(dn)?1:0, r.waist, r.weight, r.wpm, r.acc, r.benchKg, r.ohp, r.pulldown, r.row, r.hand||'', r.comms||'']);
    });
    S.push({ name:'Benchmarks', rows:b });

    const logs = getGymLogs();
    const g = [['Date','Day','Split','Exercise','Set','WeightKg','Reps','VolumeKg']];
    Object.keys(logs).sort().forEach(k => {
      const date = k.split('||')[0], name = k.slice(date.length+2), dn = hardDayFor(date), sess = sessionForDate(date);
      (logs[k]||[]).forEach((s,i) => g.push([date, (dn>=1&&dn<=hardMeta.length)?dn:'', sess?sess.label:'', name, i+1, s.w, s.r, Math.round(s.w*s.r*100)/100]));
    });
    S.push({ name:'GymSets', rows:g });

    const w = [['Date','Day'].concat(C.diet.water.map(s => s.t + ' (' + s.ml + 'ml)')).concat(['TotalMl','TargetMl','Hit'])];
    Object.keys(waterLog).sort().forEach(d => {
      const dn = hardDayFor(d), row = waterFor(d);
      w.push([d, (dn>=1&&dn<=hardMeta.length)?dn:''].concat(C.diet.water.map(s => row[s.t]?s.ml:0)).concat([waterMl(d), waterTarget(), waterMl(d)>=waterTarget()?1:0]));
    });
    S.push({ name:'Water', rows:w });

    const ph = [['Date','Day','Face','Body','Both','FaceBytes','BodyBytes']];
    photoDays().forEach(d => {
      const f = photoIx[photoKey(d,'face')], bo = photoIx[photoKey(d,'body')], dn = hardDayFor(d);
      ph.push([d, (dn>=1&&dn<=hardMeta.length)?dn:'', f?1:0, bo?1:0, (f&&bo)?1:0, f?f.bytes:0, bo?bo.bytes:0]);
    });
    S.push({ name:'Photos', rows:ph });

    const sc = [['Schedule','ShowsOn','Time','Item','Notes','Band','DoneToday']];
    const showsOn = { gym:'Tue/Wed/Fri only', rest:'Mon/Thu rest days only' };
    Object.keys(C.schedules).forEach(k => (C.schedules[k]||[]).forEach(t => sc.push([k, showsOn[t.only]||'All', t.time||'', t.label, t.notes||'', t.band||'', t.done?1:0])));
    S.push({ name:'Schedules', rows:sc });

    const gp = [['SessionKey','Session','Weekday','Time','#','Exercise','Sets','SetsAsWritten','Reps','Note','Primary','Secondary','VideoURL']];
    C.gym.forEach(d => (d.exs||[]).forEach((ex,i) => gp.push([d.key, d.label, d.day, d.time, i+1, ex.n, ex.sets, ex.setsL||String(ex.sets), ex.reps, ex.why||'',
      (ex.pri||[]).map(k=>(MG[k]||{}).l||k).join(', '), (ex.sec||[]).map(k=>(MG[k]||{}).l||k).join(', '),
      ex.vid ? (ex.vid.startsWith('http')?ex.vid:'https://www.youtube.com/watch?v='+ex.vid) : ''])));
    S.push({ name:'GymPlan', rows:gp });

    const dt = [['Template','Time','Food','Note','Kcal','Protein','Carbs','Fat']];
    C.diet.standard.forEach(r => dt.push(['Daily', r.t, r.f, r.n, r.k, r.p, r.c, r.fa]));
    C.diet.tuesday.forEach(r => dt.push(['Tuesday', r.t, r.f, r.n, '', '', '', '']));
    dt.push([]); dt.push(['Prep map','Day','Lunch','Dinner','Who cooks']);
    C.diet.prep.forEach(r => dt.push(['', r.d, r.l, r.dn, r.who]));
    dt.push([]); dt.push(['Supplement','Detail','Flag']);
    C.diet.supps.forEach(s => dt.push([s.n, s.t, s.flag]));
    S.push({ name:'Diet', rows:dt });

    const cm = [['Day','Date','Code','Silent','Mark','Watch','Apply']];
    C.comms.forEach(c => cm.push([c.d, hardDateFor(c.d), c.code, c.silent?1:0, c.mark||'', c.watch, c.apply]));
    S.push({ name:'Comms', rows:cm });

    const go = [['Period','Goal','Note','Done']];
    ['week','month','year'].forEach(p => (goals[p]||[]).forEach(x => go.push([p, x.text, x.note||'', x.done?1:0])));
    S.push({ name:'Goals', rows:go });

    const dd = [['Date','Title','Note','DaysFromToday']];
    [...events].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => dd.push([e.date, e.title, e.note||'', dayDiff(e.date)]));
    S.push({ name:'Dates', rows:dd });

    const st = hardStatus();
    let full = 0; for (let i=1;i<=hardMeta.length;i++) if (hardComplete(hardDateFor(i))) full++;
    const meta = [['Field','Value'],
      ['Exported', new Date().toISOString()],
      ['App version','v3 — plan of 2 Aug 2026'],
      ['Challenge start', hardMeta.start], ['Challenge end', hardDateFor(hardMeta.length)],
      ['Length', hardMeta.length], ['Attempt', hardMeta.attempt],
      ['Current day', st.n], ['Days remaining', st.remaining],
      ['Days fully complete', full], ['Missed closed days', missedDays().length],
      ['Current streak', currentStreak()], ['Best streak', bestStreak()],
      ['Surgery day 40', hardDateFor(40)], ['Surgical window ends day 54', hardDateFor(54)],
      ['In surgical window today', inSurgical()?'yes':'no'],
      ['Cleared to walk', prefs.clearedToWalk?'yes':'no'],
      ['Photo days recorded', photoDays().length]];
    hardMeta.history.forEach(a => meta.push(['Attempt '+a.attempt+' reached day', a.reached]));
    S.push({ name:'Meta', rows: meta });
    return S;
  }

  function backupObject() {
    const dump = { app:'MasterDailyPlan', schema:3, exportedAt:new Date().toISOString(), data:{} };
    Object.keys(SK).forEach(k => { const v = localStorage.getItem(SK[k]); if (v != null) dump.data[SK[k]] = v; });
    return dump;
  }
  function exportXlsx() {
    try { download(buildXlsx(collectSheets()), 'MasterPlan_' + todayStr() + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); toast('Spreadsheet exported'); }
    catch (e) { toast('Export failed: ' + e.message); }
  }
  function exportJson() {
    download(JSON.stringify(backupObject(), null, 2), 'MasterPlan_backup_' + todayStr() + '.json', 'application/json');
    toast('Backup downloaded (no photos — use the ZIP for those)');
  }
  async function exportZip() {
    toast('Packing…');
    try {
      const files = [];
      files.push({ name:'MasterPlan.xlsx', data: buildXlsx(collectSheets()) });
      files.push({ name:'backup.json', data: enc.encode(JSON.stringify(backupObject(), null, 2)) });
      let all = [];
      try { all = await IDB.all(); } catch (e) { all = []; }
      all.sort((a,b) => (a.date+a.kind).localeCompare(b.date+b.kind));
      all.forEach(p => {
        const dn = hardDayFor(p.date);
        const tag = (dn>=1&&dn<=hardMeta.length) ? ('day-' + String(dn).padStart(2,'0') + '-' + p.date) : p.date;
        const b64 = String(p.data).split(',')[1] || '';
        if (b64) files.push({ name:'photos/' + tag + '-' + p.kind + '.jpg', data: b64ToU8(b64) });
      });
      const st = hardStatus();
      files.push({ name:'README.txt', data: enc.encode(
`MASTER DAILY PLAN — export ${new Date().toISOString()}

${st.state==='pending'?'Not started yet':'Day '+st.n+' of '+st.L}  ·  start ${hardMeta.start}  ·  end ${hardDateFor(hardMeta.length)}  ·  attempt ${hardMeta.attempt}

MasterPlan.xlsx   12 sheets:
  75HardLog   one row per day, one column per non-negotiable, plus split, comms code and water
  Benchmarks  waist, weight, WPM, accuracy and the four lifts, every check-in
  GymSets     every set logged: weight x reps, with volume
  Water       the 8-slot schedule, day by day
  Photos      index of which photos exist (images are in photos/)
  Schedules   the three daily routines and the to-do list
  GymPlan     the six sessions as programmed

backup.json       complete app state. Restore via Data > Restore from backup.
photos/           day-NN-YYYY-MM-DD-face.jpg and -body.jpg

Send the whole zip to Claude and ask for the analysis you want.
`) });
      download(zipStore(files), 'MasterPlan_' + todayStr() + '.zip', 'application/zip');
      toast('ZIP exported — ' + all.length + ' photos included');
    } catch (e) { toast('ZIP failed: ' + e.message); }
  }
  function restoreJson(file) {
    const fr = new FileReader();
    fr.onload = () => {
      let d; try { d = JSON.parse(fr.result); } catch (e) { toast('Not a valid backup file'); return; }
      if (!d || d.app !== 'MasterDailyPlan' || !d.data) { toast('Not a Master Plan backup'); return; }
      const keys = Object.keys(d.data);
      if (!confirm('Restore backup from ' + (d.exportedAt||'unknown date') + '?\n\nThis replaces everything currently on this device (' + keys.length + ' stores). Photos are not affected.')) return;
      keys.forEach(k => localStorage.setItem(k, d.data[k]));
      toast('Restored — reloading'); setTimeout(() => location.reload(), 700);
    };
    fr.readAsText(file);
  }
  function storageUsed() { let n = 0; for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); n += k.length + (localStorage.getItem(k)||'').length; } return n; }
  function reseedContent() {
    if (!confirm('Restore the built-in content defaults?\n\nSchedules, diet, gym plan, skin, hair and the comms map go back to the source PDFs. Your LOGS (ticked days, gym sets, water, benchmarks, photos) are NOT touched.')) return;
    const todo = C.schedules.todo;
    C = seedContent(); C.schedules.todo = todo; saveC(); render(); toast('Content defaults restored');
  }
  async function wipeAll() {
    if (!confirm('Erase everything on this device, including photos?\n\nThis cannot be undone. Export a ZIP first if you are not certain.')) return;
    if (!confirm('Really erase? Last chance.')) return;
    Object.keys(SK).forEach(k => localStorage.removeItem(SK[k]));
    try { await IDB.clear(); } catch (e) {}
    location.reload();
  }
  function openData() {
    const pb = Object.values(photoIx).reduce((a,p)=>a+(p.bytes||0),0);
    $('#storageInfo').textContent = 'Settings ~' + Math.round(storageUsed()/1024) + ' KB · photos ~' + Math.round(pb/1024) + ' KB';
    $('#dataModal').classList.remove('hidden');
  }

  /* ============================ WEATHER ============================ */
  const OXFORD = { lat:51.7520, lon:-1.2577, city:'Oxford' };
  const WMO = {0:['☀️','Clear'],1:['🌤️','Mainly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Rime fog'],
    51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌦️','Heavy drizzle'],56:['🌧️','Freezing drizzle'],57:['🌧️','Freezing drizzle'],
    61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],
    71:['🌨️','Light snow'],73:['❄️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Showers'],81:['🌧️','Showers'],
    82:['⛈️','Violent showers'],85:['🌨️','Snow showers'],86:['🌨️','Snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Thunderstorm']};
  function paintWeather(w) {
    if (!w) return;
    const [icon,label] = WMO[w.code] || ['🌡️','Weather'];
    $('#wIcon').textContent = icon; $('#wTemp').textContent = Math.round(w.temp) + '°';
    const hl = (w.hi!=null&&w.lo!=null) ? ` · H${Math.round(w.hi)}° L${Math.round(w.lo)}°` : '';
    $('#wMeta').textContent = (w.city||label) + hl;
  }
  function getPosition() {
    return new Promise((res) => {
      if (!navigator.geolocation) return res(OXFORD);
      navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude, lon:p.coords.longitude, city:null}), () => res(OXFORD), {timeout:8000, maximumAge:1800000});
    });
  }
  async function fetchWeather() {
    if (!navigator.onLine) return;
    try {
      const pos = await getPosition();
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.lat}&longitude=${pos.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
      if (!res.ok) throw new Error('http ' + res.status);
      const d = await res.json();
      let city = pos.city;
      if (!city) { try { const g = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.lat}&longitude=${pos.lon}&localityLanguage=en`); if (g.ok) { const gj = await g.json(); city = gj.city||gj.locality||gj.principalSubdivision||null; } } catch(_){} }
      const w = { temp:d.current.temperature_2m, code:d.current.weather_code, hi:d.daily?.temperature_2m_max?.[0], lo:d.daily?.temperature_2m_min?.[0], city:city||OXFORD.city, ts:Date.now() };
      lsSet(SK.weather, JSON.stringify(w)); paintWeather(w);
    } catch (e) {
      if (!localStorage.getItem(SK.weather)) { $('#wTemp').textContent='--°'; $('#wMeta').textContent='Unavailable'; $('#wIcon').textContent='🌡️'; }
    }
  }
  function initWeather() {
    const cached = localStorage.getItem(SK.weather);
    if (cached) { try { paintWeather(JSON.parse(cached)); } catch(_){} }
    fetchWeather();
    $('#weatherPill').onclick = () => { $('#wIcon').textContent='⏳'; fetchWeather().then(()=>toast('Weather updated')); };
    window.addEventListener('online', fetchWeather);
    setInterval(fetchWeather, 1800000);
  }

  /* ============================ INIT ============================ */
  function tickClock() {
    const d = new Date();
    $('#clock').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    $('#dateLabel').textContent = d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
  }
  function pickToday() {
    activeTab = scheduleKeyFor(new Date());
    const s = sessionForDate(todayStr());
    gymDay = s ? s.key : C.gym[0].key;
    dietTab = new Date().getDay() === 2 ? 'tue' : 'std';
  }
  function init() {
    loadPrefs();
    loadContent();
    loadHard();
    autoResetOnNewDay();
    loadWater(); loadBench(); loadPhotoIx(); loadEvents(); loadGoals();
    pickToday();

    document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { activeTab = b.dataset.tab; renderList(); });
    document.querySelectorAll('.body-btn').forEach(b => b.onclick = () => { bodyTab = b.dataset.body; window.scrollTo(0,0); render(); });
    document.querySelectorAll('.list-btn').forEach(b => b.onclick = () => { listTab = b.dataset.list; window.scrollTo(0,0); render(); });
    document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => setView(b.dataset.view));

    $('#editToggle').onclick = () => setEditMode(!editMode);
    $('#addBtn').onclick     = () => openModal(null);
    $('#resetBtn').onclick   = resetDay;
    $('#modalClose').onclick = closeModal;
    $('#modalSave').onclick  = saveModal;
    $('#modalDelete').onclick= deleteCurrent;
    $('#modal').onclick = (e) => { if (e.target === $('#modal')) closeModal(); };

    $('#recClose').onclick = closeRec;
    $('#recSave').onclick  = () => (recCommit ? recCommit() : saveRec());
    $('#recUp').onclick    = () => moveRec(-1);
    $('#recDown').onclick  = () => moveRec(1);
    $('#recModal').onclick = (e) => { if (e.target === $('#recModal')) closeRec(); };

    $('#photoClose').onclick = closePhoto;

    $('#dataBtn').onclick   = openData;
    $('#dataClose').onclick = () => $('#dataModal').classList.add('hidden');
    $('#dataModal').onclick = (e) => { if (e.target === $('#dataModal')) $('#dataModal').classList.add('hidden'); };
    $('#btnZip').onclick    = exportZip;
    $('#btnXlsx').onclick   = exportXlsx;
    $('#btnJson').onclick   = exportJson;
    $('#btnRestore').onclick= () => $('#fileRestore').click();
    $('#fileRestore').onchange = (e) => { if (e.target.files[0]) restoreJson(e.target.files[0]); };
    $('#btnSeed').onclick   = () => { $('#dataModal').classList.add('hidden'); reseedContent(); };
    $('#btnWipe').onclick   = wipeAll;

    tickClock(); setInterval(tickClock, 1000); setInterval(updateSummary, 30000);
    initWeather();
    render();
  }
  document.addEventListener('DOMContentLoaded', init);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
